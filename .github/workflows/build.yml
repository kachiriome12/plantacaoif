name: Compilar mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.1.1
      - name: Compilar
        run: |
          MODS=$(find . -name mods.toml -not -path "./.git/*" | head -1)
          PROJ=$(dirname "$(dirname "$(dirname "$(dirname "$(dirname "$MODS")")")")")
          echo "Projeto em: $PROJ"
          cd "$PROJ"
          cat > settings.gradle <<'EOT'
          pluginManagement {
              repositories {
                  gradlePluginPortal()
                  maven { url = 'https://maven.minecraftforge.net/' }
              }
          }
          rootProject.name = 'terrainfinita'
          EOT
          cat > gradle.properties <<'EOT'
          org.gradle.jvmargs=-Xmx3G
          org.gradle.daemon=false
          EOT
          cat > build.gradle <<'EOT'
          plugins {
              id 'eclipse'
              id 'idea'
              id 'maven-publish'
              id 'net.minecraftforge.gradle' version '[6.0,6.2)'
          }
          version = '1.0.0'
          group = 'com.terrainfinita'
          base { archivesName = 'terrainfinita' }
          java.toolchain.languageVersion = JavaLanguageVersion.of(17)
          minecraft {
              mappings channel: 'official', version: '1.20.1'
          }
          repositories { mavenCentral() }
          dependencies {
              minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
          }
          tasks.named('jar', Jar).configure {
              finalizedBy 'reobfJar'
          }
          tasks.withType(JavaCompile).configureEach {
              options.encoding = 'UTF-8'
          }
          EOT
          gradle build
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/libs/*.jar "$GITHUB_WORKSPACE/out/"
      - uses: actions/upload-artifact@v4
        with:
          name: terrainfinita-jar
          path: out/*.jar
